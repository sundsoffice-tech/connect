<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>$titel</title>
<style>
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:block;
  src:url("${wurzel}assets/fonts/source-serif-4-latin.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400 600;font-display:block;
  src:url("${wurzel}assets/fonts/ibm-plex-sans-latin.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:block;
  src:url("${wurzel}assets/fonts/ibm-plex-mono-latin.woff2") format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4f4f1;color:#1c1f1e}
.flaeche{display:flex;flex-direction:column;width:1200px;height:630px;padding:64px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:32px;padding-bottom:28px;border-bottom:3px solid #0f766e}
.logo{display:flex;align-items:center;gap:16px;font:600 30px/1.2 "Source Serif 4",Georgia,serif}
.logo svg{width:40px;height:40px;flex:none;color:#0f766e}
.adresse{font:400 21px/1.3 "IBM Plex Mono",ui-monospace,monospace;color:#5c625f}
.text{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
h1{margin:0;font:600 54px/1.14 "Source Serif 4",Georgia,serif;letter-spacing:-.01em;text-wrap:balance}
p{margin:26px 0 0;font:400 27px/1.35 "IBM Plex Sans",system-ui,sans-serif;color:#5c625f}
</style>
</head>
<body>
<div class="flaeche">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 L28 18 H21 V28 H11 V18 H4 Z" fill="currentColor"/></svg>
      <span>S&amp;S Connect</span>
    </div>
    <div class="adresse">sundsconnect.de</div>
  </div>
  <div class="text">
    <h1>$titel</h1>
    <p>$unterzeile</p>
  </div>
</div>
</body>
</html>
