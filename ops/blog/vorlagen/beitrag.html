<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="$csp">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>$seitentitel</title>
<meta name="description" content="$beschreibung">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="$kanonisch">
$kopf_meta
<link rel="icon" href="${wurzel}assets/img/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="${wurzel}assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="${wurzel}assets/img/favicon-180.png">
<link rel="preload" href="${wurzel}assets/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="${wurzel}assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="$css">
<script type="application/ld+json">
$jsonld
</script>
</head>
<body>
<main>

<div class="brand">
  <a class="logo" href="$wurzel" aria-label="Zur Startseite von S&amp;S Connect">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 L28 18 H21 V28 H11 V18 H4 Z" fill="currentColor"/></svg>
    <span>S&amp;S Connect</span>
  </a>
  <div class="meta">$meta_stand</div>
</div>

<nav class="brotkrumen nur-web" aria-label="Brotkrumen">$brotkrumen</nav>

<article>
<h1>$titel</h1>
$vorspann
$anhaenge
$inhaltsverzeichnis
$inhalt
$verwandte

<div class="kontakt">
  $kontakt
  $quellen
</div>
</article>

<footer>
  $lizenz
  <p class="fusslinks nur-web"><a href="${wurzel}impressum/">Impressum</a> <a href="${wurzel}datenschutz/">Datenschutz</a> <a href="${wurzel}blog/">Blog</a> <a href="$wurzel">Startseite S&amp;S Connect</a></p>
</footer>

</main>
</body>
</html>
