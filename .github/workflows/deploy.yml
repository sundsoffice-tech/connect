name: Website pruefen

# Seit 02.11.2026 keine GitHub-Pages-Zweitausgabe mehr: sundsconnect.de laeuft allein auf sunds-hub.
# Dieser Lauf prueft nur Blog, Tests und die Kopierliste, er veroeffentlicht nichts.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Blog pruefen
        run: |
          set -euo pipefail
          python3 --version
          python3 ops/blog/blog.py pruefen
          python3 ops/blog/test_blog.py
      - name: Kopierliste pruefen
        run: |
          set -euo pipefail
          # Die Kopierliste steht in ops/veroeffentlichen.liste, derselbe Code baut den Webroot auf sunds-hub.
          bash ops/sunds-hub/bauen.sh --nur-kopieren . _site

          echo "Inhalt von _site/:" && ls -la _site/
