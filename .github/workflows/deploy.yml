name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare deployment
        run: |
          set -euo pipefail
          mkdir -p _site

          # Pflicht-Files am Root (jeweils einzeln, damit ein fehlendes File nicht den ganzen Step kippt)
          # CNAME entfaellt seit 01.09.2026: Domain laeuft auf sunds-hub, Pages ist Zweitausgabe unter sundsoffice-tech.github.io/connect/
          for f in index.html 404.html robots.txt sitemap.xml; do
            [ -f "$f" ] && cp "$f" _site/
          done

          # Pflicht-Verzeichnisse am Root
          for d in assets css js; do
            [ -d "$d" ] && cp -r "$d" _site/
          done

          # Statische Unterseiten
          for d in services projects contact impressum datenschutz 3d-hero promo; do
            [ -d "$d" ] && cp -r "$d" _site/
          done

          # Discovery-Formulare (Obscure-Paths d-*) — automatisch alle mitnehmen
          shopt -s nullglob
          for d in d-*/; do
            cp -r "$d" _site/
          done
          shopt -u nullglob

          echo "Inhalt von _site/:" && ls -la _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
